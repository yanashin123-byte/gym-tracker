<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>筋トレ記録</title>
<link rel="manifest" href="manifest-gym.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="筋トレ">
<meta name="theme-color" content="#0f0f0f">
<link rel="apple-touch-icon" href="icon-gym-180.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0f0f;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    min-height: 100vh;
    padding-bottom: 76px;
  }

  header {
    background: #1a1a1a;
    padding: 16px 20px 12px;
    border-bottom: 1px solid #2a2a2a;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  header h1 { font-size: 18px; font-weight: 700; }

  .header-btns { display: flex; gap: 8px; }

  .icon-btn {
    background: #2a2a2a;
    border: none;
    border-radius: 8px;
    color: #aaa;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }

  .day-tabs {
    display: flex;
    gap: 8px;
  }

  .day-tab {
    flex: 1;
    padding: 8px 0;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    background: #2a2a2a;
    color: #666;
    transition: all 0.2s;
    line-height: 1.4;
  }

  .day-tab.active-A { background: #dc5050; color: #fff; }
  .day-tab.active-B { background: #34a89a; color: #fff; }
  .day-tab.active-C { background: #4285f4; color: #fff; }

  .date-bar {
    padding: 10px 20px;
    background: #161616;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #222;
  }

  .date-bar label { color: #666; font-size: 12px; white-space: nowrap; }

  .date-bar input[type="date"] {
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    color: #eee;
    padding: 7px 10px;
    font-size: 15px;
    flex: 1;
  }

  .today-btn {
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    color: #aaa;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }

  .section-wrap { padding: 14px 20px; }

  .section-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #555;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .exercise-card {
    background: #1e1e1e;
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
    border: 1px solid #2a2a2a;
  }

  /* 種目選択パネル */
  .slot-picker {
    background: #161616;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .slot-picker-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 14px;
    font-size: 13px;
    font-weight: 700;
    color: #ccc;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .slot-list { padding: 0 14px 10px; }
  .slot-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px solid #222;
  }
  .slot-name {
    font-size: 12px;
    color: #888;
    width: 84px;
    flex-shrink: 0;
  }
  .slot-select {
    flex: 1;
    min-width: 0;
    background: #2a2a2a;
    border: 1px solid #333;
    border-radius: 8px;
    color: #eee;
    padding: 9px 10px;
    font-size: 13px;
  }

  /* RIR（限界までの距離）入力 */
  .rir-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px 14px;
  }
  .rir-label { font-size: 11px; color: #777; flex-shrink: 0; }
  .rir-btns { display: flex; gap: 6px; flex: 1; }
  .rir-btn {
    flex: 1;
    background: #2a2a2a;
    border: 1px solid #333;
    border-radius: 8px;
    color: #aaa;
    padding: 8px 0;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .rir-btn.active { background: #1b5e20; border-color: #2e7d32; color: #fff; }

  .rir-select {
    background: #14241c; border: 1px solid #25402f; border-radius: 6px;
    color: #7dd8a8; padding: 4px 2px; font-size: 13px; width: 100%;
    text-align: center; -webkit-appearance: none; appearance: none;
  }
  .rir-hint { font-size: 10px; color: #555; padding: 0 14px 12px; }

  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: #161616; border-top: 1px solid #2a2a2a; z-index: 200;
  }
  .tab-btn { flex: 1; background: none; border: none; color: #666; padding: 9px 0 13px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .tab-btn.active { color: #fff; }
  .tab-btn .ic { display: block; font-size: 19px; margin-bottom: 1px; }

  .week-counter { margin: 12px 20px 0; padding: 12px 14px; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 14px; }
  .wc-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .wc-title { font-size: 12px; color: #aaa; font-weight: 700; }
  .wc-count { font-size: 14px; font-weight: 700; }
  .wc-count.hit { color: #2ecc71; }
  .wc-count.miss { color: #e8a93b; }
  .wc-dots { display: flex; gap: 6px; }
  .wc-dot { flex: 1; height: 8px; border-radius: 99px; background: #2a2a2a; }
  .wc-dot.on { background: #2ecc71; }

  .day-suggest { margin: 8px 20px 0; padding: 10px 14px; background: #15201c; border: 1px solid #244; border-radius: 12px; font-size: 12px; color: #9cc; cursor: pointer; }
  .day-suggest:empty { display: none; }
  .day-suggest b { color: #7dd8c8; }

  .card-tools { padding: 0 14px 10px; }
  .mini-btn { background: #222; border: 1px solid #333; border-radius: 8px; color: #aaa; padding: 7px 10px; font-size: 12px; cursor: pointer; }
  .mini-btn:active { opacity: 0.7; }

  .trend-box { margin: 0 14px 10px; padding: 8px 10px; background: #161616; border: 1px solid #242424; border-radius: 8px; }
  .trend-head { display: flex; justify-content: space-between; font-size: 11px; color: #888; margin-bottom: 2px; }
  .trend-foot { display: flex; justify-content: space-between; font-size: 9px; color: #555; }

  /* 週間ボリュームパネル */
  .vol-card {
    background: #1e1e1e;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    padding: 12px 14px;
  }
  .vol-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
  }
  .vol-muscle { font-size: 12px; color: #ccc; width: 70px; flex-shrink: 0; }
  .vol-bar-bg {
    flex: 1;
    height: 8px;
    background: #2a2a2a;
    border-radius: 99px;
    overflow: hidden;
  }
  .vol-bar { height: 100%; border-radius: 99px; }
  .vol-bar.vol-under { background: #c0392b; }
  .vol-bar.vol-ok    { background: #2ecc71; }
  .vol-bar.vol-over  { background: #e08e0b; }
  .vol-num { font-size: 12px; font-weight: 700; width: 64px; text-align: right; flex-shrink: 0; }
  .vol-num.vol-under { color: #e07b6b; }
  .vol-num.vol-ok    { color: #2ecc71; }
  .vol-num.vol-over  { color: #e8a93b; }
  .vol-target { color: #555; font-weight: 400; font-size: 10px; }
  .vol-note { font-size: 10px; color: #555; margin-top: 8px; line-height: 1.5; }

  .exercise-header {
    padding: 12px 14px 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .exercise-name { font-weight: 700; font-size: 15px; }

  .prev-box { text-align: right; }

  .prev-label { font-size: 10px; color: #555; margin-bottom: 2px; }

  .prev-val { font-size: 13px; font-weight: 700; color: #555; }
  .prev-val.has-data { color: #f0c040; }

  .prev-date { font-size: 10px; color: #444; }

  .rec-bar {
    margin: 0 14px 10px;
    padding: 7px 10px;
    background: #0d2420;
    border: 1px solid #1a3a30;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
  }
  .rec-label { color: #34a89a; font-weight: 700; white-space: nowrap; }
  .rec-val { color: #7dd8c8; font-weight: 700; }
  .rec-note { color: #3a6a60; font-size: 11px; margin-left: auto; }

  .weight-row {
    padding: 0 14px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .weight-label { font-size: 11px; color: #555; white-space: nowrap; }

  select {
    background: #2a2a2a;
    border: 1px solid #383838;
    border-radius: 8px;
    color: #eee;
    padding: 8px 6px;
    font-size: 15px;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    text-align: center;
  }

  .sets-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 0 14px 12px;
  }

  .set-col { display: flex; flex-direction: column; gap: 4px; }
  .set-label { font-size: 10px; color: #555; text-align: center; font-weight: 600; }

  .weight-input {
    background: #2a2a2a;
    border: 1px solid #383838;
    border-radius: 8px;
    color: #eee;
    padding: 8px 10px;
    font-size: 18px;
    width: 100%;
    text-align: center;
    -moz-appearance: textfield;
  }
  .weight-input::-webkit-outer-spin-button,
  .weight-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .weight-input::placeholder { color: #444; }

  .cheat-input {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    color: #f0a040;
    padding: 4px;
    font-size: 12px;
    width: 100%;
    text-align: center;
    -moz-appearance: textfield;
  }
  .cheat-input::-webkit-outer-spin-button,
  .cheat-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .cheat-input::placeholder { color: #333; font-size: 10px; }
  .cheat-label { font-size: 9px; color: #444; text-align: center; }

  .save-btn {
    display: block;
    width: calc(100% - 40px);
    margin: 4px 20px 0;
    padding: 15px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .save-btn:active { opacity: 0.75; }
  .save-A { background: #dc5050; color: #fff; }
  .save-B { background: #34a89a; color: #fff; }
  .save-C { background: #4285f4; color: #fff; }
  .new-session-btn { display:block; width: calc(100% - 40px); margin: 8px 20px 0; padding: 11px; border: 1px solid #333; border-radius: 12px; background: #1e1e1e; color: #aaa; font-size: 13px; font-weight: 600; cursor: pointer; }

  .export-row {
    display: flex;
    gap: 10px;
    padding: 14px 20px 0;
  }

  .export-btn {
    flex: 1;
    padding: 11px;
    border: 1px solid #333;
    border-radius: 10px;
    background: #1e1e1e;
    color: #aaa;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }

  .export-btn:active { background: #2a2a2a; }

  .divider { height: 1px; background: #1e1e1e; margin: 16px 0 0; }

  .history-card {
    background: #1a1a1a;
    border-radius: 12px;
    margin-bottom: 8px;
    overflow: hidden;
    border: 1px solid #222;
  }

  .history-date-bar {
    padding: 9px 14px;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
  }

  .history-date-bar.day-A { background: #2a1010; color: #dc5050; }
  .history-date-bar.day-B { background: #0a2420; color: #34a89a; }
  .history-date-bar.day-C { background: #0a1828; color: #4285f4; }

  .history-row {
    display: flex;
    align-items: center;
    padding: 7px 14px;
    border-top: 1px solid #1e1e1e;
    gap: 8px;
  }

  .h-name { flex: 1; font-size: 12px; color: #bbb; }
  .h-weight { font-size: 13px; font-weight: 700; color: #eee; min-width: 55px; text-align: right; }
  .h-sets { font-size: 11px; color: #555; text-align: right; }

  .empty { color: #444; font-size: 14px; text-align: center; padding: 36px 0; }

  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: #2a2a2a;
    border: 1px solid #444;
    color: #eee;
    padding: 11px 22px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: #1e1e1e;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    width: 100%;
    max-height: 70vh;
  }

  .modal h3 { font-size: 15px; margin-bottom: 12px; color: #eee; }

  .modal textarea {
    width: 100%;
    height: 180px;
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    color: #6aff6a;
    font-family: monospace;
    font-size: 12px;
    padding: 12px;
    resize: none;
  }

  .modal-btns { display: flex; gap: 8px; margin-top: 12px; }

  .modal-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .modal-copy { background: #4285f4; color: #fff; }
  .modal-close { background: #2a2a2a; color: #aaa; }

  /* 休憩終了フラッシュ（バイブがiOSで動かないため、確実に気づける視覚合図） */
  #rest-flash {
    position: fixed; inset: 0; z-index: 1500;
    background: #2ecc71; opacity: 0; pointer-events: none;
    transition: opacity 0.15s ease-out;
  }
  #rest-flash.on { opacity: 0.55; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>💪 筋トレ記録</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="sync-status" style="font-size:12px;color:#666;">⏳ 読込中...</span>
      <button class="icon-btn" onclick="loadFromGitHub()">🔄</button>
      <button class="icon-btn" onclick="openSettings()">⚙️</button>
    </div>
  </div>
  <div class="day-tabs">
    <button class="day-tab" id="tab-A" onclick="switchDay('A')">Day A<br>Push</button>
    <button class="day-tab" id="tab-B" onclick="switchDay('B')">Day B<br>Pull</button>
    <button class="day-tab" id="tab-C" onclick="switchDay('C')">Day C<br>Legs</button>
  </div>
</header>

<div id="view-log">
  <div class="date-bar">
    <label>日付</label>
    <input type="date" id="date-input">
    <button class="today-btn" onclick="setToday()">今日</button>
  </div>

  <div class="week-counter" id="week-counter"></div>
  <div class="day-suggest" id="day-suggest"></div>

  <div class="section-wrap">
    <div class="section-title">今日の記録</div>
    <div id="exercise-cards"></div>
  </div>

  <div style="padding:0 20px 6px">
    <textarea id="session-note" rows="2" placeholder="📝 今日のメモ（なぜいけたか・体調・睡眠・食事など）" oninput="scheduleDraftSave()"
      style="width:100%;box-sizing:border-box;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#ddd;padding:10px;font-size:13px;resize:vertical"></textarea>
  </div>
  <button class="save-btn save-A" id="save-btn" onclick="saveRecord()">✅ 保存</button>
  <button class="new-session-btn" onclick="prefillFromLast()">⤴ 前回の値を全種目に入れる</button>
  <button class="new-session-btn" onclick="newSession()">＋ 別のセッションを記録（新規）</button>
</div>

<div id="view-history" style="display:none">
  <div class="section-wrap">
    <div id="volume-panel"></div>
  </div>
  <div class="divider"></div>
  <div class="section-wrap">
    <div id="region-balance-panel"></div>
  </div>
  <div class="divider"></div>
  <div class="section-wrap">
    <div class="section-title">過去の記録</div>
    <div id="history-list"></div>
  </div>
</div>

<div id="view-cardio" style="display:none">
  <div class="section-wrap">
    <div class="section-title">有酸素を記録</div>
    <div style="background:#1e1e1e;border:1px solid #2a2a2a;border-radius:14px;padding:14px">
      <div class="date-bar" style="padding:0 0 12px;border:none">
        <label>日付</label>
        <input type="date" id="cardio-date-input">
        <button class="today-btn" onclick="setCardioToday()">今日</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <select id="cardio-type" style="grid-column:1/-1;background:#2a2a2a;border:1px solid #333;border-radius:8px;color:#eee;padding:10px;font-size:14px">
          <option value="ランニングマシン（ラン）">🏃 ランニングマシン（ラン）</option>
          <option value="ランニングマシン（ウォーク）">🚶 ランニングマシン（ウォーク）</option>
          <option value="アップライトバイク">🚴 アップライトバイク</option>
          <option value="クロストレーナー">🏋️ クロストレーナー</option>
          <option value="その他">その他</option>
        </select>
        <div>
          <div style="font-size:11px;color:#777;margin-bottom:3px">時間 (分)</div>
          <input type="number" id="cardio-min" min="0" step="1" inputmode="numeric" style="width:100%;box-sizing:border-box;background:#2a2a2a;border:1px solid #333;border-radius:8px;color:#eee;padding:10px;font-size:14px">
        </div>
        <div>
          <div style="font-size:11px;color:#777;margin-bottom:3px">距離 (km)</div>
          <input type="number" id="cardio-km" min="0" step="0.1" inputmode="decimal" style="width:100%;box-sizing:border-box;background:#2a2a2a;border:1px solid #333;border-radius:8px;color:#eee;padding:10px;font-size:14px">
        </div>
        <div>
          <div style="font-size:11px;color:#777;margin-bottom:3px">平均心拍数 (bpm)</div>
          <input type="number" id="cardio-hr" min="0" step="1" inputmode="numeric" style="width:100%;box-sizing:border-box;background:#2a2a2a;border:1px solid #333;border-radius:8px;color:#eee;padding:10px;font-size:14px">
        </div>
        <div>
          <div style="font-size:11px;color:#777;margin-bottom:3px">主観強度 RPE (1-10)</div>
          <input type="number" id="cardio-rpe" min="1" max="10" step="1" inputmode="numeric" style="width:100%;box-sizing:border-box;background:#2a2a2a;border:1px solid #333;border-radius:8px;color:#eee;padding:10px;font-size:14px">
        </div>
        <div style="grid-column:1/-1">
          <div style="font-size:11px;color:#777;margin-bottom:3px">消費カロリー (kcal)</div>
          <input type="number" id="cardio-kcal" min="0" step="1" inputmode="numeric" style="width:100%;box-sizing:border-box;background:#2a2a2a;border:1px solid #333;border-radius:8px;color:#eee;padding:10px;font-size:14px">
        </div>
      </div>
      <input type="text" id="cardio-note" placeholder="📝 メモ（コース・体調など）" style="width:100%;box-sizing:border-box;background:#161616;border:1px solid #2a2a2a;border-radius:8px;color:#ccc;padding:9px 10px;font-size:12px;margin-bottom:12px">
      <button class="save-btn" style="background:#2e8b8b" onclick="saveCardio()">✅ 有酸素を記録</button>
    </div>
  </div>
  <div class="divider"></div>
  <div class="section-wrap">
    <div class="section-title">直近の有酸素記録</div>
    <div id="cardio-history-list"></div>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="vtab-log" onclick="showView('log')"><span class="ic">📝</span>記録</button>

<script>
// 種目プール（FITPLACE24綾瀬店の設備ベース）
// 各枠(slot)の先頭が初期選択。代替種目を枠内で選べる。
// muscle=部位（週間ボリューム集計の単位）/ sets=推奨セット数
const MENU = {
  A: { name: 'Push', slots: [
    { slot: '胸 メイン',  muscle: '胸',   sets: 4, options: ['ベンチプレス', 'スミスマシンベンチプレス', 'チェストプレス', 'インクラインチェストプレス', 'チェスト＆デクラインコンボ', 'インクラインダンベルプレス', 'ダンベルプレス'] },
    { slot: '胸 補助',    muscle: '胸',   sets: 3, options: ['ペックフライ', 'ケーブルフライ', 'ディップス'] },
    { slot: '肩 プレス',  muscle: '肩',   sets: 3, options: ['ダンベルショルダープレス', 'ショルダープレスマシン', 'スミスマシンショルダープレス'] },
    { slot: '肩 サイド',  muscle: '肩',   sets: 3, options: ['サイドレイズ', 'ケーブルサイドレイズ'] },
    { slot: '三頭',       muscle: '三頭', sets: 3, options: ['ケーブルプッシュダウン', 'スカルクラッシャー', 'ディップス'] },
  ]},
  B: { name: 'Pull', slots: [
    { slot: '背中 縦引き', muscle: '背中', sets: 4, options: ['ラットプルダウン', 'ワイドプルダウン', '懸垂', 'フロントロー(斜め下引き)'] },
    { slot: '背中 横引き', muscle: '背中', sets: 4, options: ['ローロウ', 'ワンハンドダンベルロウ'] },
    { slot: '背中 補助',   muscle: '背中', sets: 3, options: ['プルオーバー', 'デッドリフト', 'ケーブルプルオーバー'] },
    { slot: '二頭',        muscle: '二頭', sets: 3, options: ['ダンベルカール', 'インクラインダンベルカール', 'ケーブルカール'] },
    { slot: '後肩・僧帽',  muscle: '後肩', sets: 3, options: ['リバースフライ', 'シュラッグ'] },
    { slot: '脚 軽め',     muscle: '脚',       sets: 2, options: ['レッグプレス', 'スクワット', 'ハックスクワット'] },
    { slot: 'カーフ',      muscle: 'カーフ・腹', sets: 2, options: ['カーフレイズ'] },
  ]},
  C: { name: 'Legs', slots: [
    { slot: '脚 メイン',  muscle: '脚',       sets: 4, options: ['スクワット', 'ハックスクワット', 'レッグプレス', 'アングルドレッグプレス', 'スミスマシンスクワット'] },
    { slot: '大腿四頭',   muscle: '脚',       sets: 3, options: ['レッグエクステンション'] },
    { slot: 'ハム・尻',   muscle: 'ハム・尻', sets: 3, options: ['レッグカール', 'ヒップスラスト'] },
    { slot: '内/外もも',  muscle: '内/外',    sets: 3, options: ['アダクション', 'アブダクション'] },
    { slot: 'カーフ・腹', muscle: 'カーフ・腹', sets: 3, options: ['カーフレイズ', 'アブドミナルクランチ', 'ロータリートーソー'] },
  ]},
};

// 種目名 → 部位内サブリージョン（同じ「胸」「肩」「背中」でも上部/下部・広背筋/脊柱起立筋等で偏りが出ないよう追跡する）
const EXERCISE_REGION = {
  // 胸：上部・中部・下部
  'ベンチプレス': '中部', 'スミスマシンベンチプレス': '中部', 'チェストプレス': '中部', 'ダンベルプレス': '中部',
  'インクラインチェストプレス': '上部', 'インクラインダンベルプレス': '上部',
  'チェスト＆デクラインコンボ': '下部', 'ディップス': '下部',
  'ペックフライ': '中部', 'ケーブルフライ': '中部',
  // 肩：前部（プレス）・側部（サイド）・後部（リア）・僧帽
  'ダンベルショルダープレス': '前部', 'ショルダープレスマシン': '前部', 'スミスマシンショルダープレス': '前部',
  'サイドレイズ': '側部', 'ケーブルサイドレイズ': '側部',
  'リバースフライ': '後部', 'シュラッグ': '僧帽',
  // 背中：広背筋（縦引き系）・中背部（横引き系＝僧帽・菱形）・脊柱起立筋
  'ラットプルダウン': '広背筋', 'ワイドプルダウン': '広背筋', '懸垂': '広背筋',
  'フロントロー(斜め下引き)': '広背筋', 'プルオーバー': '広背筋', 'ケーブルプルオーバー': '広背筋',
  'ローロウ': '中背部', 'ワンハンドダンベルロウ': '中背部',
  'デッドリフト': '脊柱起立筋',
};
function regionFor(name) { return EXERCISE_REGION[name] || null; }
// 各部位で追跡するサブリージョン一覧（表示順）
const REGION_GROUPS = {
  '胸': ['上部', '中部', '下部'],
  '肩': ['前部', '側部', '後部', '僧帽'],
  '背中': ['広背筋', '中背部', '脊柱起立筋'],
};

// 週間ボリューム目標（セット/週・部位別。筋肥大の用量反応に基づく10-20set/部位ベース）
const VOLUME_TARGET = {
  '胸': [10,20], '肩': [10,18], '三頭': [6,12],
  '背中': [10,20], '二頭': [6,12], '後肩': [6,12],
  '脚': [10,20], 'ハム・尻': [8,16], '内/外': [4,10], 'カーフ・腹': [6,15],
};

const SKIP = '__skip__';
const ADD  = '__add__';

const REPS = Array.from({length: 21}, (_, i) => i);

let currentDay = 'A';
let records = [];
let editingId = null;

// 枠ごとの選択（{ A: {0:'ベンチプレス', 1:'__skip__', ...}, ... }）
let selection = JSON.parse(localStorage.getItem('gym_selection') || '{}');
// 自分で追加した種目（{ 'A:0': ['自作種目'] }）
let customOptions = JSON.parse(localStorage.getItem('gym_custom') || '{}');
// 種目選択パネルの開閉
let pickerOpen = false;

function saveSelection() { localStorage.setItem('gym_selection', JSON.stringify(selection)); }
function saveCustom() { localStorage.setItem('gym_custom', JSON.stringify(customOptions)); }
// その日に追加した種目（型の枠を超えて足す分）。{ A: ['インクラインチェストプレス', ...] }
let extras = JSON.parse(localStorage.getItem('gym_extras') || '{}');
function saveExtras() { localStorage.setItem('gym_extras', JSON.stringify(extras)); }
// 既知の全種目（全Dayのメニュー＋自作＋過去記録）を名前一致のために集約
function allKnownExercises() {
  const set = new Set();
  for (const day of ['A','B','C']) {
    MENU[day].slots.forEach((_, si) => slotOptions(day, si).forEach(o => set.add(o)));
  }
  records.forEach(r => (r.exercises || []).forEach(ex => set.add(ex.name)));
  return Array.from(set).sort();
}

function slotOptions(day, si) {
  const base = MENU[day].slots[si].options;
  const cust = customOptions[`${day}:${si}`] || [];
  return [...base, ...cust];
}

function chosenFor(day, si) {
  const sel = selection[day] && selection[day][si];
  if (sel !== undefined) return sel;
  return MENU[day].slots[si].options[0]; // 初期選択＝先頭
}

// その日の有効な種目（選択済み・スキップ除外・重複除外）
function activeExercises(day) {
  const out = [];
  MENU[day].slots.forEach((_, si) => {
    const c = chosenFor(day, si);
    if (c && c !== SKIP && !out.includes(c)) out.push(c);
  });
  (extras[day] || []).forEach(name => { if (name && !out.includes(name)) out.push(name); });
  return out;
}

// 種目名 → 所属slot（部位・推奨セット数の参照用）
function slotForExercise(name) {
  for (const day of ['A','B','C']) {
    const slots = MENU[day].slots;
    for (let si = 0; si < slots.length; si++) {
      if (slotOptions(day, si).includes(name)) return slots[si];
    }
  }
  return null;
}
function muscleFor(name) { const s = slotForExercise(name); return s ? s.muscle : 'その他'; }
function recSetsFor(name) { const s = slotForExercise(name); return s ? s.sets : 3; }

// 今週（月〜日）の部位別ボリューム（実施セット数を集計）
function weeklyVolume() {
  const today = new Date(); today.setHours(0,0,0,0);
  const offsetToMonday = (today.getDay() + 6) % 7;
  const monday = new Date(today); monday.setDate(today.getDate() - offsetToMonday);
  const vol = {};
  records.forEach(r => {
    const d = new Date(r.date + 'T00:00:00');
    if (d < monday || d > today) return;
    r.exercises.forEach(ex => {
      const m = muscleFor(ex.name);
      const doneSets = (ex.sets || []).filter(s => s > 0).length;
      vol[m] = (vol[m] || 0) + doneSets;
    });
  });
  return vol;
}

function renderVolume() {
  const el = document.getElementById('volume-panel');
  if (!el) return;
  const vol = weeklyVolume();
  const order = ['胸','肩','三頭','背中','二頭','後肩','脚','ハム・尻','内/外','カーフ・腹'];
  const rows = order.map(m => {
    const done = vol[m] || 0;
    const [min, max] = VOLUME_TARGET[m] || [0,0];
    let cls = 'vol-under', mark = '不足';
    if (done >= min && done <= max) { cls = 'vol-ok'; mark = 'OK'; }
    else if (done > max) { cls = 'vol-over'; mark = '過剰'; }
    const pct = max ? Math.min(100, Math.round(done / max * 100)) : 0;
    return `
      <div class="vol-row">
        <span class="vol-muscle">${m}</span>
        <div class="vol-bar-bg"><div class="vol-bar ${cls}" style="width:${pct}%"></div></div>
        <span class="vol-num ${cls}">${done}<span class="vol-target">/${min}-${max}</span></span>
      </div>`;
  }).join('');
  // 背中の不足を強めにアラート（Pull放置防止・最大ボトルネック）
  const backDone = vol['背中'] || 0;
  const backMin = (VOLUME_TARGET['背中'] || [10])[0];
  let alertHTML = '';
  if (backDone < backMin) {
    alertHTML = `<div style="background:#3a1414;border:1px solid #6a2424;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px;color:#f08080;font-weight:700">🚨 背中 ${backDone}/${backMin}-${(VOLUME_TARGET['背中']||[,20])[1]}set — Pull（Day B）が不足。次のジムは背中を入れよう（ボリュームが筋肥大の最大ドライバー）</div>`;
  }
  el.innerHTML = `
    <div class="section-title">今週のボリューム（月〜日・部位別セット数）</div>
    ${alertHTML}
    <div class="vol-card">${rows}</div>
    <div class="vol-note">目標：各部位 週${'10-20'}set（小さい筋は6-12）／緑=適正・赤=不足・橙=過剰</div>`;
  renderRegionBalance();
}

// 直近14日（約2週間＝Push/Pullを2周分）の部位内サブリージョン別セット数
// 「胸はやってるが上部だけ抜けてる」のような偏りを検出する
function regionVolume14d() {
  const today = new Date(); today.setHours(0,0,0,0);
  const from = new Date(today); from.setDate(from.getDate() - 13);
  const vol = {}; // { '胸': {上部:0,中部:0,下部:0}, ... }
  records.forEach(r => {
    const d = new Date(r.date + 'T00:00:00');
    if (d < from || d > today) return;
    r.exercises.forEach(ex => {
      const region = regionFor(ex.name);
      if (!region) return;
      const m = muscleFor(ex.name);
      const doneSets = (ex.sets || []).filter(s => s > 0).length;
      if (!vol[m]) vol[m] = {};
      vol[m][region] = (vol[m][region] || 0) + doneSets;
    });
  });
  return vol;
}

function renderRegionBalance() {
  const el = document.getElementById('region-balance-panel');
  if (!el) return;
  const vol = regionVolume14d();
  const muscles = Object.keys(REGION_GROUPS);
  const blocks = muscles.map(m => {
    const regions = REGION_GROUPS[m];
    const data = vol[m] || {};
    const total = regions.reduce((s, r) => s + (data[r] || 0), 0);
    const maxOne = Math.max(1, ...regions.map(r => data[r] || 0));
    const rows = regions.map(r => {
      const n = data[r] || 0;
      const neglected = total > 0 && n === 0; // 他は積んでるのにここだけ0＝偏り
      const pct = Math.round(n / maxOne * 100);
      const cls = neglected ? 'vol-under' : (n > 0 ? 'vol-ok' : '');
      return `
        <div class="vol-row">
          <span class="vol-muscle">${r}${neglected ? ' ⚠️' : ''}</span>
          <div class="vol-bar-bg"><div class="vol-bar ${cls}" style="width:${pct}%"></div></div>
          <span class="vol-num ${cls}">${n}set</span>
        </div>`;
    }).join('');
    const warn = regions.filter(r => total > 0 && (data[r] || 0) === 0);
    const warnHTML = warn.length
      ? `<div style="font-size:11px;color:#e07b6b;margin:2px 0 6px">⚠️ ${m}は${warn.join('・')}が抜けてます</div>` : '';
    return `<div style="margin-bottom:12px"><div style="font-size:12px;color:#999;font-weight:700;margin-bottom:4px">${m}</div>${warnHTML}${rows}</div>`;
  }).join('');
  el.innerHTML = `
    <div class="section-title">部位内バランス（直近14日・上部/下部など）</div>
    <div class="vol-card">${blocks}</div>
    <div class="vol-note">同じ部位でも角度が偏ると発達が偏る。⚠️は「他はやってるのにここだけ0」の合図</div>`;
}

function onSlotChange(day, si, val) {
  if (val === ADD) {
    const name = (prompt('追加する種目名を入力') || '').trim();
    if (name) {
      const key = `${day}:${si}`;
      customOptions[key] = customOptions[key] || [];
      if (!slotOptions(day, si).includes(name)) customOptions[key].push(name);
      saveCustom();
      selection[day] = selection[day] || {};
      selection[day][si] = name;
      saveSelection();
    }
  } else {
    selection[day] = selection[day] || {};
    selection[day][si] = val;
    saveSelection();
  }
  renderExercises();
  loadForm();
}

function togglePicker() {
  pickerOpen = !pickerOpen;
  renderExercises();
  loadForm();
}

function onAddExtra(day, val) {
  if (!val) return;
  let name = val;
  if (val === ADD) {
    name = (prompt('追加する種目名を入力（履歴を引き継ぐには既存と同じ名前で）') || '').trim();
    if (!name) { renderExercises(); loadForm(); return; }
  }
  extras[day] = extras[day] || [];
  // すでに枠で選択中 or 追加済みなら重複させない
  if (!activeExercises(day).includes(name)) extras[day].push(name);
  saveExtras();
  renderExercises();
  loadForm();
}

function removeExtra(day, name) {
  extras[day] = (extras[day] || []).filter(n => n !== name);
  saveExtras();
  renderExercises();
  loadForm();
}

// 固定メニュー（毎回選ばずに済むよう、実績とバランスに基づいて確定した種目）
// 順番は空き状況で自由に前後してOK。疲れてる日はセット数を自分で減らして良い。
const FIXED_MENU_VERSION = 3;
const FIXED_SELECTION = {
  A: { 0: 'チェスト＆デクラインコンボ', 1: 'インクラインチェストプレス', 2: 'ショルダープレスマシン', 3: 'サイドレイズ', 4: 'ケーブルプッシュダウン' },
  B: { 0: 'ラットプルダウン', 1: 'ローロウ', 2: 'ケーブルプルオーバー', 3: 'ケーブルカール', 4: 'リバースフライ', 5: 'レッグプレス', 6: 'カーフレイズ' },
};
function applyFixedMenuIfNeeded() {
  if (localStorage.getItem('gym_menu_fixed_version') === String(FIXED_MENU_VERSION)) return;
  selection.A = { ...(selection.A || {}), ...FIXED_SELECTION.A };
  selection.B = { ...(selection.B || {}), ...FIXED_SELECTION.B };
  saveSelection();
  localStorage.setItem('gym_menu_fixed_version', String(FIXED_MENU_VERSION));
}

function init() {
  setToday();
  loadFromLocalStorage();
  applyFixedMenuIfNeeded();
  switchDay('A');
  updateEarphoneToggleUI();
  initCloud();
}

function setToday() {
  const d = new Date();
  document.getElementById('date-input').value =
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function switchDay(day) {
  currentDay = day;
  ['A','B','C'].forEach(d => {
    const t = document.getElementById(`tab-${d}`);
    t.className = `day-tab${d === day ? ` active-${d}` : ''}`;
  });
  document.getElementById('save-btn').className = `save-btn save-${day}`;
  renderExercises();
  loadForm();
  renderHistory();
  renderVolume();
  renderWeekCounter();
}

let currentView = 'log';
function showView(view) {
  currentView = view;
  document.getElementById('view-log').style.display = view === 'log' ? 'block' : 'none';
  document.getElementById('view-cardio').style.display = view === 'cardio' ? 'block' : 'none';
  document.getElementById('view-history').style.display = view === 'history' ? 'block' : 'none';
  document.getElementById('vtab-log').className = 'tab-btn' + (view === 'log' ? ' active' : '');

function mergeCardioRemote(remoteCardio) {
  const norm = c => ({ ...c, updatedAt: typeof c.updatedAt === 'number' ? c.updatedAt : 0 });
  const merged = new Map();
  (remoteCardio || []).map(norm).forEach(c => merged.set(c.id, c));
  (cardio || []).map(norm).forEach(c => {
    const ex = merged.get(c.id);
    if (!ex || (c.updatedAt || 0) >= (ex.updatedAt || 0)) merged.set(c.id, c);
  });
  cardio = Array.from(merged.values()).sort((a,b) => a.date.localeCompare(b.date));
}

// 種目の重量推移スパークライン（その日の過去記録から最大8回分）
function renderTrend(name) {
  const pts = [];
  for (let i = 0; i < records.length; i++) {
    if (records[i].day !== currentDay) continue;
    const ex = records[i].exercises.find(e => e.name === name);
    if (ex && ex.weight > 0) pts.push({ date: records[i].date, w: ex.weight });
  }
  if (pts.length < 2) return '';
  const data = pts.slice(-8);
  const ws = data.map(p => p.w);
  const min = Math.min(...ws), max = Math.max(...ws);
  const W = 260, H = 34, pad = 4;
  const span = (max - min) || 1;
  const xy = data.map((p, i) => {
    const x = pad + (W - pad * 2) * (data.length === 1 ? 0.5 : i / (data.length - 1));
    const y = H - pad - (H - pad * 2) * (p.w - min) / span;
    return [x, y];
  });
  const line = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const dots = xy.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="#34a89a"/>`).join('');
  const last = data[data.length - 1].w, first = data[0].w;
  const diff = last - first;
  const trendTxt = diff > 0 ? `▲+${(Math.round(diff*10)/10)}kg` : diff < 0 ? `▼${(Math.round(diff*10)/10)}kg` : '→ 横ばい';
  const trendCol = diff > 0 ? '#2ecc71' : diff < 0 ? '#e07b6b' : '#888';
  return `
    <div class="trend-box">
      <div class="trend-head"><span>推移（直近${data.length}回）</span><span style="color:${trendCol};font-weight:700">${trendTxt}</span></div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
        <path d="${line}" fill="none" stroke="#34a89a" stroke-width="1.5"/>${dots}
      </svg>
      <div class="trend-foot"><span>${min}kg</span><span>${max}kg</span></div>
    </div>`;
}

// 指定週（月曜開始のDateオブジェクト）に「トレした」日付の集合を返す
// 【最低ラインの公式ルール】筋トレ(records)だけでなく有酸素(cardio)もカウントする。
// HYROXが新目標のため「きつい日は走るだけでもOK」を正式に採用（サボりではなくレース練習として扱う）
function trainingDatesInWeek(monday, sunday) {
  const dates = new Set();
  records.forEach(r => {
    const d = new Date(r.date + 'T00:00:00');
    if (d >= monday && d <= sunday) dates.add(r.date);
  });
  (cardio || []).forEach(c => {
    const d = new Date(c.date + 'T00:00:00');
    if (d >= monday && d <= sunday) dates.add(c.date);
  });
  return dates;
}

// 何週連続で週4回を達成してるか（今週は集計中なので対象外、先週から遡る）
function computeStreak(TARGET) {
  const today = new Date(); today.setHours(0,0,0,0);
  const offsetToMonday = (today.getDay() + 6) % 7;
  let monday = new Date(today); monday.setDate(today.getDate() - offsetToMonday);
  monday.setDate(monday.getDate() - 7); // 先週の月曜から遡る
  let streak = 0;
  for (let i = 0; i < 52; i++) {
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    const n = trainingDatesInWeek(monday, sunday).size;
    if (n >= TARGET) { streak++; monday.setDate(monday.getDate() - 7); }
    else break;
  }
  return streak;
}

// 直近何日、筋トレも有酸素も記録が無いか（3日以上で強制的に最低ラインを促す）
function daysSinceLastTraining() {
  const today = new Date(); today.setHours(0,0,0,0);
  const allDates = new Set();
  records.forEach(r => allDates.add(r.date));
  (cardio || []).forEach(c => allDates.add(c.date));
  if (allDates.size === 0) return 999;
  let maxDate = null;
  allDates.forEach(ds => {
    const d = new Date(ds + 'T00:00:00');
    if (!maxDate || d > maxDate) maxDate = d;
  });
  return Math.round((today - maxDate) / 86400000);
}

function renderWeekCounter() {
  const el = document.getElementById('week-counter');
  if (!el) return;
  const TARGET = 4;
  const today = new Date(); today.setHours(0,0,0,0);
  // 月曜始まりの今週（月〜日）
  const offsetToMonday = (today.getDay() + 6) % 7; // 月=0..日=6
  const monday = new Date(today); monday.setDate(today.getDate() - offsetToMonday);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const trainDates = trainingDatesInWeek(monday, sunday);
  const n = trainDates.size;
  const hit = n >= TARGET;
  const dots = Array.from({length: TARGET}, (_, i) => `<div class="wc-dot${i < n ? ' on' : ''}"></div>`).join('');
  const extra = n > TARGET ? ` <span style="color:#2ecc71">+${n - TARGET}</span>` : '';
  const streak = computeStreak(TARGET);
  const streakHTML = streak > 0
    ? `<div style="font-size:12px;color:#ff9f43;margin-top:6px">🔥 ${streak}週連続 週4達成中</div>` : '';
  const gapDays = daysSinceLastTraining();
  const gapHTML = gapDays >= 3
    ? `<div style="background:#3a1414;border:1px solid #6a2424;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13px;color:#f08080;font-weight:700">🚨 ${gapDays}日間トレなし。最低ラインを発動：今日は🏃有酸素タブで走るだけでもいいから行こう</div>`
    : '';
  el.innerHTML = `
    <div class="wc-top">
      <span class="wc-title">今週のトレ（月〜日）</span>
      <span class="wc-count ${hit ? 'hit' : 'miss'}">${n}/${TARGET}回${hit ? ' ✓' : ''}${extra}</span>
    </div>
    <div class="wc-dots">${dots}</div>
    ${streakHTML}
    ${gapHTML}
    <div style="font-size:11px;color:#666;margin-top:6px">💡 最低ライン：きつい日は🏃有酸素タブで走るだけでもOK（HYROX練習として1回にカウント）</div>`;
  renderDaySuggest();
}

function getRecommendation(name) {
  // ダブルプログレッション × RIR（限界までの距離）
  // 筋肥大の最大駆動因子は「限界への近さ(RIR)」。rep数だけでなくRIRで判定する。
  // 目標: 8-12repを RIR 0-2（あと0〜2回が限界）で。全セット上限到達かつ余裕ありなら重量アップ。
  const ZONE_MIN = 8;
  const ZONE_MAX = 12;

  for (let i = records.length - 1; i >= 0; i--) {
    if (records[i].day !== currentDay) continue;
    if (records[i].id === editingId) continue;
    const ex = records[i].exercises.find(e => e.name === name);
    if (!ex) continue;
    const activeSets = ex.sets.filter(s => s > 0);
    if (!activeSets.length) continue;

    const weight = ex.weight || 0;
    const minReps = Math.min(...activeSets);
    const setCount = activeSets.length;
    // マシンの刻み幅を前回の重量から自動判定（5kg刻み機は5、2.5刻み機は2.5、1kg刻みは1、それ以外は0.5）
    let inc = 0.5;
    if (weight > 0) {
      if (weight % 5 === 0) inc = 5;
      else if (weight % 2.5 === 0) inc = 2.5;
      else if (weight % 1 === 0) inc = 1;
    }
    // RIR: セット別なら最後の有効セットの値（最も疲労＝追い込み度）。旧データは単一rirにフォールバック
    let rir = null;
    if (Array.isArray(ex.rirs)) {
      for (let s = ex.sets.length - 1; s >= 0; s--) {
        if (ex.sets[s] > 0 && typeof ex.rirs[s] === 'number') { rir = ex.rirs[s]; break; }
      }
    } else if (typeof ex.rir === 'number') {
      rir = ex.rir;
    }
    // チート開始rep（最も早く崩れたセット）→ フォーム破綻の早さ
    const cheatStarts = (ex.cheating || []).filter(c => typeof c === 'number' && c > 0);
    const earliestCheat = cheatStarts.length ? Math.min(...cheatStarts) : null;
    const formBreaking = earliestCheat !== null && earliestCheat <= Math.ceil(minReps * 0.6);

    let recWeight, targetReps, note;

    if (minReps >= ZONE_MAX) {
      // 全セット上限到達 → 重量アップ。RIRに余裕があれば確信度UP
      recWeight = weight + inc;
      targetReps = `${ZONE_MIN}`;
      note = (rir !== null && rir >= 2) ? '重量アップ ▲（まだ余裕あり）' : '重量アップ ▲';
    } else if (minReps >= ZONE_MIN) {
      // ゾーン内（8-11rep）
      if (rir !== null && rir >= 4) {
        // 余裕を残しすぎ＝刺激不足。追い込みを優先
        recWeight = weight;
        targetReps = `${ZONE_MAX}`;
        note = 'あと1-2repまで追い込む';
      } else {
        recWeight = weight;
        targetReps = `${ZONE_MAX}`;
        note = '全セット12rep目標';
      }
    } else if (minReps >= 6) {
      // 6-7rep
      if (rir !== null && rir >= 3) {
        // repは低いが余力あり＝早く止めすぎ。同重量で追い込む
        recWeight = weight;
        targetReps = `${ZONE_MIN}-${ZONE_MAX}`;
        note = '止めが早い。あと数repいける';
      } else {
        recWeight = weight;
        targetReps = `${ZONE_MIN}-${ZONE_MAX}`;
        note = 'フォーム安定優先';
      }
    } else {
      // 5rep以下＝重量過多
      recWeight = Math.max(0, weight - inc);
      targetReps = `${ZONE_MIN}-${ZONE_MAX}`;
      note = '重量を下げる ▼';
    }

    // フォーム破綻が早い場合、重量アップは保留してフォーム優先
    if (formBreaking && recWeight > weight) {
      recWeight = weight;
      note = 'フォーム崩れ早め→重量据え置き';
    }

    return { weight: recWeight, reps: targetReps, sets: recSetsFor(name), note };
  }
  return null;
}

function renderPicker() {
  const day = currentDay;
  const regionVol = regionVolume14d(); // 部位内バランス（直近14日）→ 手薄なサブリージョンを選択時に案内する
  const rows = MENU[day].slots.map((slot, si) => {
    const chosen = chosenFor(day, si);
    const regions = REGION_GROUPS[slot.muscle];
    const muscleData = regionVol[slot.muscle] || {};
    const muscleTotal = regions ? regions.reduce((s, r) => s + (muscleData[r] || 0), 0) : 0;
    const opts = slotOptions(day, si).map(o => {
      const r = regionFor(o);
      const neglected = regions && r && muscleTotal > 0 && (muscleData[r] || 0) === 0;
      const label = r ? `${o}　${neglected ? '🎯' : ''}(${r})` : o;
      return `<option value="${o}"${o === chosen ? ' selected' : ''}>${label}</option>`;
    }).join('');
    const skipSel = chosen === SKIP ? ' selected' : '';
    // 選んでいる種目が今、部位内で手薄なサブリージョンならヒントを出す
    const chosenRegion = regionFor(chosen);
    let hintHTML = '';
    if (regions && chosenRegion) {
      const neglectedNow = regions.filter(r => muscleTotal > 0 && (muscleData[r] || 0) === 0 && r !== chosenRegion);
      if (neglectedNow.length) {
        hintHTML = `<div style="font-size:10px;color:#e8b878;margin-top:2px">🎯 直近2週間 ${neglectedNow.join('・')}が手薄。バランス的には切り替えるのもアリ</div>`;
      }
    }
    return `
      <div class="slot-row">
        <span class="slot-name">${slot.slot}</span>
        <div style="flex:1;min-width:0">
          <select class="slot-select" style="width:100%;box-sizing:border-box" onchange="onSlotChange('${day}',${si},this.value)">
            ${opts}
            <option value="${SKIP}"${skipSel}>― やらない</option>
            <option value="${ADD}">＋ 自分で追加</option>
          </select>
          ${hintHTML}
        </div>
      </div>`;
  }).join('');
  const count = activeExercises(day).length;
  // 追加した種目（型の枠外）
  const exList = (extras[day] || []);
  const extraRows = exList.map(name => `
      <div class="slot-row">
        <span class="slot-name" style="color:#7dd8a8">＋追加</span>
        <span style="flex:1;min-width:0;font-size:13px">${name}</span>
        <button type="button" onclick="removeExtra('${day}','${name.replace(/'/g, "\\'")}')" style="background:none;border:none;color:#888;font-size:16px;cursor:pointer;padding:0 4px;">×</button>
      </div>`).join('');
  const addOpts = allKnownExercises()
    .filter(n => !activeExercises(day).includes(n))
    .map(n => `<option value="${n}">${n}</option>`).join('');
  const addControl = `
      <div class="slot-row">
        <span class="slot-name">種目を追加</span>
        <select class="slot-select" onchange="onAddExtra('${day}',this.value); this.value='';">
          <option value="">＋ 追加する種目を選ぶ…</option>
          ${addOpts}
          <option value="${ADD}">＋ 自分で入力</option>
        </select>
      </div>`;
  return `
    <div class="slot-picker">
      <div class="slot-picker-head" onclick="togglePicker()">
        <span>🎯 今日の種目を選ぶ（${count}種目）</span>
        <span>${pickerOpen ? '▲' : '▼'}</span>
      </div>
      <div class="slot-list" style="display:${pickerOpen ? 'block' : 'none'}">${rows}${extraRows}${addControl}</div>
    </div>`;
}

async function saveRecord() {
  const date = document.getElementById('date-input').value;
  if (!date) { showToast('日付を入力してください'); return; }

  const exercises = activeExercises(currentDay).map(name => ({
    name,
    weight: parseFloat(document.getElementById(`${name}-weight`).value) || 0,
    sets: [1,2,3,4].map(s => parseInt(document.getElementById(`${name}-set${s}`).value)),
    cheating: [1,2,3,4].map(s => {
      const v = document.getElementById(`${name}-set${s}-cheat`).value;
      return v ? parseInt(v) : null;
    }),
    rirs: [1,2,3,4].map(s => {
      const v = document.getElementById(`${name}-set${s}-rir`).value;
      return v === '' ? null : parseInt(v);
    }),
    note: ((document.getElementById(`${name}-note`) || {}).value || '').trim()
  }));

  const sessionNote = ((document.getElementById('session-note') || {}).value || '').trim();
  const now = Date.now();
  if (editingId) {
    const idx = records.findIndex(r => r.id === editingId);
    if (idx >= 0) {
      records[idx] = { ...records[idx], date, day: currentDay, exercises, note: sessionNote, updatedAt: now };
    } else {
      editingId = genId();
      records.push({ id: editingId, date, day: currentDay, exercises, note: sessionNote, updatedAt: now });
    }
  } else {
    editingId = genId();
    records.push({ id: editingId, date, day: currentDay, exercises, note: sessionNote, updatedAt: now });
  }

  records.sort((a,b) => a.date.localeCompare(b.date));
  clearDraft();
  updateSaveBtnLabel();
  await saveToGitHub();
  renderExercises();
  loadForm();
  renderHistory();
  renderVolume();
  renderWeekCounter();
  showToast('✅ 保存しました');
}

function fmt(s) {

let gymSeeded = false;
async function seedGymFromLegacyIfEmpty() {
  if (gymSeeded) return;
  gymSeeded = true;
  try {
    const res = await fetch('https://raw.githubusercontent.com/yanashin123-byte/gym-tracker/main/records.json?_=' + Date.now());

      const legacy = await res.json();
      mergeGymRemote(legacy.records || []);

function subscribeCloud() {
  const { fs } = fbMods;
  const ref = fs.doc(fbDb, 'gymData', 'main');
  showSyncStatus('⏳ 読込中...');
  unsubGymDoc = fs.onSnapshot(ref, async (snap) => {
    if (snap.exists()) {
      const remote = snap.data();
      mergeGymRemote(remote.records || []);
      mergeCardioRemote(remote.cardio || []);
      saveToLocalStorage();
    } else {
      await seedGymFromLegacyIfEmpty();
    }
    renderExercises(); loadForm(); renderHistory(); renderVolume(); renderWeekCounter(); renderCardioHistory();
    showSyncStatus('✅ 同期済み');
    pendingSync = false;
  }, (_err) => {
    showSyncStatus('📵 オフライン');
  });
}

function toBase64UTF8(str) {
  const bytes = new TextEncoder().encode(str);
  return btoa(Array.from(bytes).map(b => String.fromCharCode(b)).join(''));
}

function fromBase64UTF8(b64) {
  const binaryStr = atob(b64.replace(/\n/g, ''));
  const bytes = new Uint8Array(binaryStr.split('').map(c => c.charCodeAt(0)));
  return new TextDecoder().decode(bytes);
}

// records配列をid+updatedAtでマージ（新しい方を採用・ローカル編集を消さない）
function mergeGymRemote(remoteRecords) {
  const localStr = localStorage.getItem('gym_records');
  const localRecords = localStr ? JSON.parse(localStr) : records;
  const norm = r => ({ ...r, id: r.id || `${r.date}-${r.day}`, updatedAt: typeof r.updatedAt === 'number' ? r.updatedAt : 0 });
  const merged = new Map();
  (remoteRecords || []).map(norm).forEach(r => merged.set(r.id, r));
  (localRecords || []).map(norm).forEach(r => {
    const ex = merged.get(r.id);
    if (!ex || (r.updatedAt || 0) >= (ex.updatedAt || 0)) merged.set(r.id, r);
  });
  records = Array.from(merged.values()).sort((a, b) => a.date.localeCompare(b.date));
}

// 呼び出し元互換のため名前は維持（実体はFirestoreへの書き込み）
async function saveToGitHub() {
  saveToLocalStorage();
  if (!fbUser || !fbDb) {
    showSyncStatus('🔑 未ログイン');
    pendingSync = true;
    return;
  }
  const { fs } = fbMods;
  try {
    showSyncStatus('⏳ 保存中...');
    await fs.setDoc(fs.doc(fbDb, 'gymData', 'main'), { records, cardio, updatedAt: Date.now() });
    showSyncStatus('✅ 同期済み');
    pendingSync = false;
  } catch (e) {
    showSyncStatus('⚠️ 同期失敗');
    pendingSync = true;
  }
}

  if (!rec) return;
  if (!confirm(`${fmt(rec.date)} Day ${rec.day} の記録を削除しますか？`)) return;
  records = records.filter(r => r.id !== id);
  if (editingId === id) { editingId = null; clearDraft(); }
  saveToGitHub();
  renderExercises();
  renderHistory();
  renderVolume();
  renderWeekCounter();
  updateSaveBtnLabel();
  showToast('🗑️ 削除しました');

function genId() {
  return 'r' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
}
// 旧データ（id/updatedAt無し）に互換キーを付与
function normalizeRecords() {
  records.forEach(r => {
    if (!r.id) r.id = `${r.date}-${r.day}`;
    if (typeof r.updatedAt !== 'number') r.updatedAt = 0;
  });
}
function loadFromLocalStorage() {
  const s = localStorage.getItem('gym_records');
  if (s) records = JSON.parse(s);
  normalizeRecords();
  const c = localStorage.getItem('gym_cardio');
  if (c) { try { cardio = JSON.parse(c); } catch(e) { cardio = []; } }
}

}
function toggleRestTimerEnabled() {
  restTimerEnabled = !restTimerEnabled;
  localStorage.setItem('gym_rest_timer_enabled', restTimerEnabled ? '1' : '0');
  updateRestTimerToggleUI();
  if (!restTimerEnabled) stopRestTimer();
  showToast(restTimerEnabled ? '⏱ 休憩タイマーON' : '⏱ 休憩タイマーOFF');
}

// 画面ロック中はSafariがJS自体を止めてしまい、タイマーもバイブもフラッシュも
// 動かなくなるため、休憩中だけ画面が自動で消えないようにする（対応ブラウザのみ）
let restWakeLock = null;
async function acquireRestWakeLock() {
  try {
    if ('wakeLock' in navigator) restWakeLock = await navigator.wakeLock.request('screen');
  } catch (e) {}
}
function releaseRestWakeLock() {
  try { if (restWakeLock) { restWakeLock.release(); restWakeLock = null; } } catch (e) {}
}
// タブに戻ってきたとき（バックグラウンドでWakeLockが解除されていたら）再取得する
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && restTimerInterval) acquireRestWakeLock();
});

function startRestTimer(seconds) {
  if (!restTimerEnabled) return;
  if (earphoneMode) { ensureRestTimerAudio(); unlockRestBeep(); }
  acquireRestWakeLock();
  restTimerRemaining = seconds || REST_TIMER_DEFAULT;
  const bar = document.getElementById('rest-timer-bar');
  if (bar) bar.style.display = 'flex';
  updateRestTimerDisplay();
  clearInterval(restTimerInterval);
  restTimerInterval = setInterval(() => {
    restTimerRemaining--;
    updateRestTimerDisplay();
    if (restTimerRemaining <= 0) restTimerDone();
  }, 1000);
}

function updateRestTimerDisplay() {
  const el = document.getElementById('rest-timer-display');
  if (!el) return;
  const r = Math.max(0, restTimerRemaining);
  const m = Math.floor(r / 60);
  const s = r % 60;
  el.textContent = `${m}:${String(s).padStart(2, '0')}`;
  el.style.color = r <= 10 ? '#f08080' : '#fff';
}

function adjustRestTimer(delta) {
  const bar = document.getElementById('rest-timer-bar');
  if (!bar || bar.style.display !== 'flex') return;
  restTimerRemaining = Math.max(0, restTimerRemaining + delta);
  updateRestTimerDisplay();
}

function stopRestTimer() {
  clearInterval(restTimerInterval);
  restTimerInterval = null;
  releaseRestWakeLock();
  const bar = document.getElementById('rest-timer-bar');
  if (bar) bar.style.display = 'none';
}

// イヤホン使用中フラグ（iOSはブラウザから接続状態を検知できないため手動トグル）

let earphoneMode = localStorage.getItem('gym_earphone_mode') === '1';
function updateEarphoneToggleUI() {
  const btn = document.getElementById('earphone-toggle');
  if (!btn) return;
  btn.style.background = earphoneMode ? '#1b5e20' : '#2a2a2a';
  btn.style.color = earphoneMode ? '#fff' : '#888';
}

let restBeepEl = null;
function ensureRestBeepEl() {
  if (!restBeepEl) {
    restBeepEl = new Audio(REST_BEEP_DATA_URI);
    restBeepEl.preload = 'auto';
  }
  return restBeepEl;
}
// iOSは、ユーザーの直接操作の中で一度 play() しておかないと後から鳴らせない。
// また<audio>タグでの再生はマナーモード（サイレントスイッチ）でも鳴ることが多いため、
// Web Audio API（振動音の合成）より優先してこちらを使う。
function unlockRestBeep() {
  try {
    const el = ensureRestBeepEl();
    el.volume = 1.0;
    el.muted = true;
    const p = el.play();
    if (p && p.catch) p.catch(() => {});
    el.pause();
    el.currentTime = 0;
    el.muted = false;
  } catch (e) {}
}
function playRestBeepAudio() {
  try {
    const el = ensureRestBeepEl();
    el.currentTime = 0;
    el.volume = 1.0;
    const p = el.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}

let restTimerAudioCtx = null;
function ensureRestTimerAudio() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!restTimerAudioCtx) restTimerAudioCtx = new Ctx();
    if (restTimerAudioCtx.state === 'suspended') restTimerAudioCtx.resume();
  } catch (e) {}
}
function toggleEarphoneMode() {
  earphoneMode = !earphoneMode;
  localStorage.setItem('gym_earphone_mode', earphoneMode ? '1' : '0');
  updateEarphoneToggleUI();
  if (earphoneMode) { ensureRestTimerAudio(); unlockRestBeep(); }
  showToast(earphoneMode ? '🎧 イヤホンモードON（休憩終了で音も鳴らす）' : '🎧 イヤホンモードOFF（バイブのみ）');
}

// iPhone SafariはnavigatorバイブAPI非対応のため、画面フラッシュで確実に気づけるようにする
function flashScreen(times) {
  const el = document.getElementById('rest-flash');
  if (!el) return;
  let n = 0;
  const blink = () => {
    el.classList.add('on');
    setTimeout(() => {
      el.classList.remove('on');
      n++;
      if (n < times) setTimeout(blink, 150);
    }, 180);
  };
  blink();
}

function restTimerDone() {
  clearInterval(restTimerInterval);
  restTimerInterval = null;
  flashScreen(5);
  if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch(e) {} }
  if (earphoneMode) {
    // <audio>タグでの再生を優先（iPhoneのマナーモードでも鳴ることが多いため）。
    // 失敗した場合のみWeb Audio APIの合成音にフォールバック（こちらはマナーモード中は無音になる）。
    playRestBeepAudio();
    try {
      ensureRestTimerAudio();
      const ctx = restTimerAudioCtx;
      if (ctx) {
        const beepAt = (startTime) => {
          const o = ctx.createOscillator(); const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.value = 880;
          g.gain.setValueAtTime(0, startTime);
          g.gain.linearRampToValueAtTime(0.35, startTime + 0.06);   // フェードイン
          g.gain.linearRampToValueAtTime(0.35, startTime + 0.25);
          g.gain.linearRampToValueAtTime(0, startTime + 0.45);      // フェードアウト
          o.start(startTime); o.stop(startTime + 0.5);
        };
        const now = ctx.currentTime;
        beepAt(now);
        beepAt(now + 0.55);
      }
    } catch(e) {}
  }
  showToast('⏱ 休憩終了！次のセットへ');
  setTimeout(stopRestTimer, 3000);
}

init(); // 全ての宣言（GITHUB_TOKEN等）が済んでから最後に起動する
